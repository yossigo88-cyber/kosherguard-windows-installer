name: Windows test build
on:
  push:
    paths: ['*.zip', '.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source
        run: Get-ChildItem '*installer-source.zip' | Select-Object -First 1 | Expand-Archive -DestinationPath source
      - name: Install free build dependencies
        run: python -m pip install -r source/requirements.txt pyinstaller==6.17.0
      - name: Run mocked safety tests
        run: python -m unittest discover -s source/tests -v
      - name: Build desktop exe
        working-directory: source
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KosherGuard-Setup --collect-all pymobiledevice3 --collect-all zeroconf --hidden-import usb_engine --hidden-import setup_engine app.py
      - name: Run packaged native self test without USB
        working-directory: source
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\KosherGuard-Setup.exe' -ArgumentList '--self-test', 'self-test.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Executable exited with $($p.ExitCode)" }
          if (!(Test-Path self-test.json)) { throw 'Self-test did not finish' }
          $r = Get-Content self-test.json | ConvertFrom-Json
          if ($r.passed -ne $true -or $r.usb_called -ne $false) { throw 'Self-test failed' }
          Get-Content self-test.json
          Copy-Item self-test.json dist/self-test.json
          Copy-Item README.md dist/README.md
          Get-FileHash dist/KosherGuard-Setup.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-build-${{ github.run_number }}"
          gh release create $tag source/dist/KosherGuard-Setup.exe source/dist/self-test.json source/dist/README.md source/dist/SHA256.txt --title 'KosherGuard Windows spare-phone test build' --notes 'Unsigned Windows executable. Native packaged import/Tkinter self-test and mocked safety tests passed. No real iPhone tested. No filter-active or erase-proof claim. Read README before using a spare phone.' --prerelease
